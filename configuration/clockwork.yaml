timer:
  timer_mode: fixed
  real_time_multiplier: 1
  simulation_step: 0.1
  controller_step: 1

nats:
  url: nats://localhost
  port: 4222

controllers:
  - id: j1
    type: bumblebee  # This will not work yet, as Bumblebee is not yet merged.
    options:
      algorithm: ppo
      model_file: /path/to/trained/model
      links:
        "0":
          - 5a
        "1":
          - 3a
        "2":
          - 1a
          - 1b
        "3":
          - 5a
        "4":
          - 3a
        "5":
          - 1a
          - 1b
  - id: j2
    type: bumblebee  # This will not work yet, as Bumblebee is not yet merged.
    options:
      algorithm: dqn
      model_file: /path/to/trained/model
      links:
        "0":
          - 5a
          - 5b
        "1":
          - 3a
        "2":
          - 1a
        "3":
          - 5a
          - 5b
        "4":
          - 3a
        "5":
          - 1a
