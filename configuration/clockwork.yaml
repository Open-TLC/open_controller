timer:
  timer_mode: fixed
  real_time_multiplier: 1
  simulation_step: 0.1
  controller_step: 1

nats:
  url: nats
  port: 4222

controllers:
  - id: j1
    type: fixed_time  # This is not actually meant to be used in production. It is here just for demonstration and testing.
    options:
      phases:
        - signal_states: ggrrrr
          duration: 10
        - signal_states: rrggrr
          duration: 10
        - signal_states: rrrrgg
          duration: 10

      yellow_duration: 3

detectors:
  - id: j1.0
    type: e2_detector
    options: {}
  - id: j1.1
    type: e2_detector
    options: {}
  - id: j1.1a
    type: e2_detector
    options: {}
  - id: j1.1b
    type: e2_detector
    options: {}
  - id: j1.2
    type: e2_detector
    options: {}
  - id: j1.3
    type: e2_detector
    options: {}
  - id: j1.3a
    type: e2_detector
    options: {}
  - id: j1.4
    type: e2_detector
    options: {}
  - id: j1.5
    type: e2_detector
    options: {}
  - id: j1.5a
    type: e2_detector

