services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  controller-runner:
    image: controller-runner
    container_name: oc_controller_container
    build:
      context: .
      dockerfile: services/control_engine/docker/Dockerfile
    depends_on:
      - nats

  ui-runner:
    image: ui-runner
    container_name: oc_ui_container
    build:
      context: .
      dockerfile: services/user_interfaces/docker/Dockerfile
    ports:
      - "8050:8050"
    depends_on:
      - nats

  indicators:
    image: indicators
    container_name: oc_indicators_container
    build:
      context: .
      dockerfile: services/indicators/docker/Dockerfile
    depends_on:
      - nats

  sumo-simulator:
    image: simengine-runner
    container_name: oc_simengine_container
    build:
      context: .
      dockerfile: services/simengine/docker/Dockerfile
    depends_on:
      - nats

  # The WebSUMO viewer. Runs file-free: it discovers the scenario and
  # fetches the net and the state over NATS from the simengine, so no
  # scenario files or volumes are needed. The image is self-contained:
  # docker build clones the public websumo repository and builds its
  # frontend, so plain "docker compose up" works on any machine with
  # nothing but this repository. To pick up new websumo commits, run:
  # docker compose build --no-cache websumo
  websumo:
    image: websumo
    container_name: oc_websumo_container
    build:
      # Nothing is copied from the context; it only needs to be a
      # small existing directory.
      context: services/simengine/docker
      dockerfile_inline: |
        FROM node:20-slim AS frontend
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        RUN git clone --depth 1 https://github.com/Open-TLC/websumo.git /src
        WORKDIR /src/frontend
        RUN npm ci && npm run build

        FROM python:3.11-slim
        WORKDIR /app
        COPY --from=frontend /src/backend backend
        COPY --from=frontend /src/frontend/dist frontend/dist
        RUN pip install --no-cache-dir -r backend/requirements.txt sumolib pyproj
        RUN mkdir -p /app/scenarios-empty
        WORKDIR /app/backend
        CMD ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8775"]
    ports:
      - "8775:8775"
    environment:
      NATS_URL: nats://nats:4222
      SCENARIOS_DIR: /app/scenarios-empty
    depends_on:
      - nats
