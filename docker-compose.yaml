version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  controller-runner:
    image: controller-runner
    container_name: oc_controller_container
    build:
      context: .
      dockerfile: services/control_engine/docker/Dockerfile

  ui-runner:
    image: ui-runner
    container_name: oc_ui_container
    build:
      context: .
      dockerfile: services/user_interfaces/docker/Dockerfile
    ports:
      - "8050:8050"

  indicators:
    image: indicators
    container_name: oc_indicators_container
    build:
      context: .
      dockerfile: services/indicators/docker/Dockerfile

  sumo-simulator:
    image: simengine-runner
    container_name: oc_simengine_container
    build:
      context: .
      dockerfile: services/simengine/docker/Dockerfile

  # --- WebSUMO: browser viewer for the OC simulation (opt-in) ---
  # Off by default; start with: docker compose --profile websumo up
  # File-less: everything (network file included) arrives over NATS from
  # OC's simengine, so no volumes. See doc/websumo_integration_plan.md
  # and WebSUMO's docs/SIM_PROTOCOL.md.
  websumo:
    image: websumo
    container_name: oc_websumo_container
    profiles: ["websumo"]
    build:
      context: https://github.com/Open-TLC/websumo.git   # pin a tag when one exists
    ports:
      - "8776:8775"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
